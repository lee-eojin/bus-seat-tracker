<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:1500px;background:#101319;
font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;
display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.word{margin:70px 0 0;font-size:88px;font-weight:800;letter-spacing:-.035em;color:#fff;line-height:1}
.word b{color:#FF3B52;font-weight:800}
.tag{margin:26px 0 0;font-size:27px;font-weight:600;color:#8a93a6;letter-spacing:-.01em}
.foot{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;
font-size:20px;font-weight:600;color:#4d5666}
</style>

<svg width="640" height="330" viewBox="0 0 640 330" fill="none">
  <defs>
    <!-- 여유에서 빠듯으로: 초록이 길고 노랑은 찔끔 -->
    <linearGradient id="fill-up" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="244" y2="0">
      <stop offset="0"    stop-color="#34c471"/>
      <stop offset=".38"  stop-color="#34c471"/>
      <stop offset=".62"  stop-color="#f4b41f"/>
      <stop offset="1"    stop-color="#f4b41f"/>
    </linearGradient>
  </defs>

  <!-- 상류: 아직 탈 수 있는 구간 -->
  <path d="M 24 96 H 244" stroke="url(#fill-up)" stroke-width="17" stroke-linecap="round"/>
  <!-- 하류: 만석으로 지나가는 구간 -->
  <path d="M 244 96 H 348 Q 384 96 384 132 V 204 Q 384 240 420 240 H 616"
        stroke="#E31B34" stroke-width="17" stroke-linecap="round"/>

  <!-- 지나치는 정류장: 각 구간의 판정 색 -->
  <circle cx="106" cy="96" r="15" fill="#101319" stroke="#34c471" stroke-width="12"/>
  <circle cx="512" cy="240" r="15" fill="#101319" stroke="#E31B34" stroke-width="12"/>

  <!-- 타는 정류장: 노랑이 빨강으로 넘어가기 직전, 마지막 기회 -->
  <circle cx="244" cy="96" r="66" fill="rgba(255,255,255,.06)"/>
  <circle cx="244" cy="96" r="55" fill="none" stroke="#fff" stroke-width="16"/>
  <circle cx="244" cy="96" r="21" fill="#fff"/>
</svg>

<p class="word"><b>빨간</b>버스</p>
<p class="tag">여기서 탈 수 있을까?</p>
<div class="foot">outputs-eta-fawn.vercel.app</div>
