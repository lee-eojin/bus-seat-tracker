<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0}

display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
/* 자간: 기존 -0.035em에서 크게 풀어 0.12em. 두 글자라 넓은 자간이 잘 받는다.
   letter-spacing은 마지막 글자 뒤에도 붙으므로 같은 값을 padding-left로 보정해 광학 중앙을 맞춘다 */
.word{margin:70px 0 0;font-size:96px;font-weight:800;letter-spacing:.12em;padding-left:.12em;color:#fff;line-height:1}
.tag{margin:28px 0 0;font-size:27px;font-weight:600;color:#8a93a6;letter-spacing:.02em}
.foot{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:center;gap:14px;
font-size:20px;font-weight:600;color:#4d5666}
</style>
