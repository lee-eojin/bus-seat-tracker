# 수집 한 판. collect-bus-seats.yml이 이 워크플로를 부르고, 저절로 낫는 실패였으면
# 한 번 더 불러 다른 러너를 받는다. 별도 잡이라야 새 러너가 배정된다.
name: Collect cycle

on:
  workflow_call:
    inputs:
      event-duration-minutes:
        type: string
        required: false
        default: ''
      event-interval-seconds:
        type: string
        required: false
        default: ''
    outputs:
      retryable:
        description: '저절로 낫는 실패로 아무것도 수집하지 못했다. 새 러너에서 한 번 더 해볼 만하다'
        value: ${{ jobs.collect.outputs.retryable }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      retryable: ${{ steps.collect.outputs.retryable }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 아카이브와 브랜치 준비가 판단 규칙을 dist에서 불러 쓰므로 빌드가 먼저다.
      # 심야 실행도 예전부터 이 둘을 치르고 나서 수집을 건너뛰었으므로 비용은 그대로다.
      - run: npm ci

      - run: npm run build

      - id: collection-day
        name: Determine collection day
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.BUS_DATA_REPO_TOKEN }}
          script: |
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Seoul',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(new Date());
            const partValue = (type) => parts.find((part) => part.type === type)?.value ?? '';
            const date = `${partValue('year')}-${partValue('month')}-${partValue('day')}`;
            core.setOutput('date', date);
            core.setOutput('branch', `collect/${date}`);

      # 정리가 막혀도 수집은 계속돼야 한다. 아카이브가 수집보다 앞에 있고 실패가 전파되던
      # 탓에 2026-08-07 사고에서 11회 연속으로 수집 스텝이 skipped 됐다.
      - id: archive
        name: Archive finished collection days
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          COLLECTION_DATE: ${{ steps.collection-day.outputs.date }}
        with:
          github-token: ${{ secrets.BUS_DATA_REPO_TOKEN }}
          script: |
            const path = require('node:path');
            const { finishedCollectionBranches, planArchive } = await import(
              `file://${path.join(process.env.GITHUB_WORKSPACE, 'dist/tools/collector/src/branch-archive.js')}`
            );

            const [owner, repo] = 'lee-eojin/bus-seat-tracker-data'.split('/');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            // GitHub이 과부하로 5xx를 반환하면 몇 분 안에 풀리므로 기다렸다가 다시 시도한다
            async function withRetry(request) {
              for (let attempt = 1; ; attempt += 1) {
                try {
                  return await request();
                } catch (error) {
                  const transient = !error.status || error.status === 429 || error.status >= 500;
                  if (!transient || attempt >= 5) throw error;
                  core.warning(`GitHub API 일시 오류, ${attempt * 15}초 뒤 재시도: ${error.message}`);
                  await sleep(attempt * 15000);
                }
              }
            }

            const references = await withRetry(() => github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: 'heads/collect/',
            }));
            const finished = finishedCollectionBranches(
              references.map((reference) => reference.ref.replace('refs/heads/', '')),
              process.env.COLLECTION_DATE,
            );

            let mainSha = (await withRetry(() => github.rest.git.getRef({ owner, repo, ref: 'heads/main' }))).data.object.sha;

            // 밀린 날이 여럿이면 날짜 순으로 따라잡는다. 예전에는 두 개 이상이면 던졌는데,
            // 그러면 하루 막힌 것이 영영 막힌 것이 됐다.
            for (const branch of finished) {
              const branchSha = (await withRetry(() => github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }))).data.object.sha;
              const comparison = await withRetry(() => github.rest.repos.compareCommits({
                owner,
                repo,
                base: mainSha,
                head: branchSha,
              }));
              const plan = planArchive(branch, comparison.data.status);
              if (plan.warning) core.warning(plan.warning);

              if (plan.tree !== 'none') {
                const branchCommit = await withRetry(() => github.rest.git.getCommit({ owner, repo, commit_sha: branchSha }));
                let treeSha = branchCommit.data.tree.sha;

                if (plan.tree === 'union') {
                  // 브랜치 트리를 그대로 쓰면 main에만 있는 지난 날짜 스냅샷이 지워진다.
                  // main 트리를 바닥에 깔고 브랜치 파일을 덮어 양쪽을 모두 남긴다.
                  const branchTree = await withRetry(() => github.rest.git.getTree({
                    owner,
                    repo,
                    tree_sha: treeSha,
                    recursive: 'true',
                  }));
                  if (branchTree.data.truncated) {
                    throw new Error(`${branch}의 트리가 잘려 합칠 수 없습니다. 손으로 정리해야 합니다`);
                  }
                  const mainCommit = await withRetry(() => github.rest.git.getCommit({ owner, repo, commit_sha: mainSha }));
                  const merged = await withRetry(() => github.rest.git.createTree({
                    owner,
                    repo,
                    base_tree: mainCommit.data.tree.sha,
                    tree: branchTree.data.tree
                      .filter((entry) => entry.type === 'blob')
                      .map((entry) => ({ path: entry.path, mode: entry.mode, type: 'blob', sha: entry.sha })),
                  }));
                  treeSha = merged.data.sha;
                }

                const archiveCommit = await withRetry(() => github.rest.git.createCommit({
                  owner,
                  repo,
                  message: `data: archive bus seats ${branch.slice('collect/'.length)}`,
                  tree: treeSha,
                  parents: [mainSha],
                }));
                await withRetry(() => github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: archiveCommit.data.sha }));
                mainSha = archiveCommit.data.sha;
              }

              if (plan.deleteBranch) {
                await withRetry(() => github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` }));
              }
            }

            // 다음 스텝이 main을 다시 읽지 않도록 방금 확정한 sha를 넘긴다. 쓰기 직후 읽기가
            // 갱신 전 값을 돌려주는 복제 지연이 2026-08-07 사고의 출발점이었다.
            core.setOutput('main-sha', mainSha);

      - name: Prepare collection branch
        uses: actions/github-script@v8
        env:
          COLLECTION_BRANCH: ${{ steps.collection-day.outputs.branch }}
          ARCHIVED_MAIN_SHA: ${{ steps.archive.outputs.main-sha }}
        with:
          github-token: ${{ secrets.BUS_DATA_REPO_TOKEN }}
          script: |
            const path = require('node:path');
            const { planCollectionBranch } = await import(
              `file://${path.join(process.env.GITHUB_WORKSPACE, 'dist/tools/collector/src/branch-archive.js')}`
            );

            const [owner, repo] = 'lee-eojin/bus-seat-tracker-data'.split('/');
            const branch = process.env.COLLECTION_BRANCH;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function withRetry(request) {
              for (let attempt = 1; ; attempt += 1) {
                try {
                  return await request();
                } catch (error) {
                  const transient = !error.status || error.status === 429 || error.status >= 500;
                  if (!transient || attempt >= 5) throw error;
                  core.warning(`GitHub API 일시 오류, ${attempt * 15}초 뒤 재시도: ${error.message}`);
                  await sleep(attempt * 15000);
                }
              }
            }

            // 아카이브가 넘긴 sha를 그대로 쓴다. 아카이브가 실패했을 때만 main을 읽는데,
            // 그 경로에서는 방금 쓴 값이 없으므로 복제 지연에 걸릴 일이 없다.
            const mainSha = process.env.ARCHIVED_MAIN_SHA
              || (await withRetry(() => github.rest.git.getRef({ owner, repo, ref: 'heads/main' }))).data.object.sha;

            let status = null;
            try {
              const existing = await withRetry(() => github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }));
              const comparison = await withRetry(() => github.rest.repos.compareCommits({
                owner,
                repo,
                base: mainSha,
                head: existing.data.object.sha,
              }));
              status = comparison.data.status;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const plan = planCollectionBranch(status);
            if (plan.warning) core.warning(plan.warning);
            if (plan.deleteFirst) {
              await withRetry(() => github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` }));
            }
            if (plan.create) {
              await withRetry(() => github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: mainSha }));
            }

      - uses: actions/checkout@v5
        with:
          repository: lee-eojin/bus-seat-tracker-data
          token: ${{ secrets.BUS_DATA_REPO_TOKEN }}
          path: private-data
          ref: ${{ steps.collection-day.outputs.branch }}

      # 이 스텝은 실행을 실패로 만들지 않는다. 판정은 다음 스텝이 한다. 여기서 setFailed를
      # 부르면 잡 출력이 채워지기 전에 죽어 재시도 판단을 넘길 수 없다.
      - id: collect
        name: Collect until window end
        uses: actions/github-script@v8
        env:
          COLLECTION_BRANCH: ${{ steps.collection-day.outputs.branch }}
          BUS_DATA_DIR: ${{ github.workspace }}/private-data/data
          GYEONGGI_BUS_API_KEY: ${{ secrets.GYEONGGI_BUS_API_KEY }}
          VEHICLE_HASH_SECRET: ${{ secrets.VEHICLE_HASH_SECRET }}
          EVENT_DURATION_MINUTES: ${{ inputs.event-duration-minutes }}
          EVENT_INTERVAL_SECONDS: ${{ inputs.event-interval-seconds }}
        with:
          github-token: ${{ secrets.BUS_DATA_REPO_TOKEN }}
          script: |
            const { spawnSync } = require('node:child_process');
            const fs = require('node:fs/promises');
            const path = require('node:path');

            const [owner, repo] = 'lee-eojin/bus-seat-tracker-data'.split('/');
            const branch = process.env.COLLECTION_BRANCH;
            const workspace = process.env.GITHUB_WORKSPACE;
            const privateDataRoot = path.join(workspace, 'private-data');
            const dataDirectory = path.join(privateDataRoot, 'data');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // 창 정의와 간격 규칙은 tools/collector/src/schedule.ts 한 곳에 있다.
            // 예산 계산기(npm run budget)와 테스트가 같은 모듈을 쓴다.
            const { activeWindow, scheduledIntervalSeconds, withinServiceHours } =
              await import(`file://${path.join(workspace, 'dist/tools/collector/src/schedule.js')}`);
            // 수집기는 저절로 낫는 실패에만 이 종료 코드로 끝난다.
            const { transientExitCode } = await import(`file://${path.join(workspace, 'dist/tools/collector/src/failure-kind.js')}`);

            let eventMode = false;
            const finish = (kind, reason) => {
              core.setOutput('outcome-kind', kind);
              core.setOutput('outcome-reason', reason ?? '');
              // 저절로 낫는 실패라면 다른 러너에서 한 판 더 돌 값이 있다. 이미 건진 것이 있어도
              // 남은 창을 이어받으므로 그대로 재시도한다.
              //
              // 이벤트 모드는 예외다. 종료 시각이 잡 시작 기준 상대값이라 재시도가 남은 시간을
              // 이어받지 못하고 지정한 시간을 처음부터 다시 돈다. 240분 이벤트가 230분째
              // 실패하면 합계 470분이 되고 호출도 두 배가 된다.
              core.setOutput('retryable', String(kind === 'transient' && !eventMode));
            };

            let loopStartMs = Date.now();
            let loopEndMs = Date.now();
            let eventIntervalSeconds = null;
            let oneShotMode = false;
            let cycleSucceeded = false;
            let cycleAttempted = false;
            const rawDuration = (process.env.EVENT_DURATION_MINUTES ?? '').trim();
            const eventDuration = rawDuration === '' ? 0 : Number(rawDuration);
            // 숫자가 아니거나 음수면 조용히 일반 모드로 흘려보내지 않는다. 손으로 넣는 값이라
            // 오타가 그대로 통과하면 의도한 이벤트 수집이 아예 일어나지 않는다.
            if (rawDuration !== '' && (!Number.isFinite(eventDuration) || eventDuration <= 0)) {
              throw new Error(`이벤트 수집 시간은 양수여야 합니다: ${rawDuration}`);
            }
            if (eventDuration > 0) {
              eventMode = true;
              // 손으로 넣는 값이라 검증한다. 음수 간격이 들어오면 sleep이 즉시 풀려 GBIS를
              // 사실상 연속 호출하고 일 1,000회 한도를 순식간에 태운다.
              eventIntervalSeconds = Number(process.env.EVENT_INTERVAL_SECONDS || '') || 300;
              if (!Number.isFinite(eventIntervalSeconds) || eventIntervalSeconds < 10) {
                throw new Error(`이벤트 수집 간격은 10초 이상이어야 합니다: ${process.env.EVENT_INTERVAL_SECONDS}`);
              }
              if (!Number.isFinite(eventDuration) || eventDuration > 320) {
                throw new Error(`이벤트 수집 시간은 320분을 넘을 수 없습니다: ${process.env.EVENT_DURATION_MINUTES}`);
              }
              loopEndMs = Date.now() + eventDuration * 60000;
              core.info(`이벤트 모드: ${eventDuration}분 동안 ${eventIntervalSeconds}초 간격 수집`);
            } else {
              const window = activeWindow(Date.now());
              if (window) {
                loopStartMs = window.startMs;
                loopEndMs = window.endMs;
                core.info(`창 수집: ${new Date(window.endMs).toISOString()}까지 기본 ${window.interval}초 간격, 조밀 구간은 창 설정을 따른다`);
              } else if (withinServiceHours(Date.now())) {
                // 단발 실행은 다음 사이클이 없다. 일시 오류 한 번이 그 시간대 전체 공백이
                // 되지 않도록 45초 간격으로 최대 3회 재시도한다 (2026-08-01 타임아웃 1회 +
                // 크론 스로틀 3시간이 겹쳐 7시간 공백이 난 사고).
                oneShotMode = true;
                loopEndMs = Date.now() + 3 * 60000;
                core.info('비피크: 1회 스냅샷만 수집. 실패하면 45초 간격으로 재시도한다');
              } else {
                core.info('심야 휴지: 이번 실행은 수집하지 않는다');
                finish('ok', '');
                return;
              }
            }
            // 러너 6시간 한도 보호. 남은 창은 대기 중인 다음 실행이 이어받는다.
            loopEndMs = Math.min(loopEndMs, Date.now() + 320 * 60000);

            async function listFiles(directory) {
              const entries = await fs.readdir(directory, { withFileTypes: true });
              const files = await Promise.all(entries.map(async (entry) => {
                const entryPath = path.join(directory, entry.name);
                return entry.isDirectory() ? listFiles(entryPath) : [entryPath];
              }));
              return files.flat();
            }

            // 체크아웃 시점의 파일은 이미 브랜치에 있으므로 업로드 대상에서 제외한다.
            const uploadedState = new Map();
            async function fileSignature(filePath) {
              const stat = await fs.stat(filePath);
              return `${stat.size}:${stat.mtimeMs}`;
            }
            for (const filePath of await listFiles(dataDirectory)) {
              uploadedState.set(filePath, await fileSignature(filePath));
            }

            async function uploadChangedFiles() {
              const changed = [];
              for (const filePath of await listFiles(dataDirectory)) {
                const signature = await fileSignature(filePath);
                if (uploadedState.get(filePath) !== signature) changed.push([filePath, signature]);
              }
              if (changed.length === 0) return;

              const reference = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              const previousCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: reference.data.object.sha });
              const tree = await Promise.all(changed.map(async ([filePath]) => {
                const content = await fs.readFile(filePath);
                const blob = await github.rest.git.createBlob({ owner, repo, content: content.toString('base64'), encoding: 'base64' });
                return { path: path.relative(privateDataRoot, filePath), mode: '100644', type: 'blob', sha: blob.data.sha };
              }));
              const nextTree = await github.rest.git.createTree({ owner, repo, base_tree: previousCommit.data.tree.sha, tree });
              const nextCommit = await github.rest.git.createCommit({
                owner,
                repo,
                message: `data: collect bus seats ${new Date().toISOString()}`,
                tree: nextTree.data.sha,
                parents: [reference.data.object.sha],
              });
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: nextCommit.data.sha });
              for (const [filePath, signature] of changed) uploadedState.set(filePath, signature);
            }

            // 사이클은 GBIS를 먼저 때리고 그다음 업로드한다. 업로드가 죽어도 호출은 이미 나간 뒤다.
            // 2026-07-27 저녁에 BUS_DATA_REPO_TOKEN이 만료돼 51사이클이 연속 401로 실패했는데,
            // 루프는 창 끝까지 돌아 노선까지 세면 102회를 태우고 데이터는 한 건도 남기지 못했다.
            // core.warning이라 실행은 success로 끝나 그 사실이 드러나지도 않았다.
            //
            // 인증 실패는 재시도해도 안 풀리므로 첫 번째에 끊는다. 그 밖의 실패는 연속 3회까지
            // 봐준다. 3회에서 끊는 이유는 예산 절약이 아니라, 같은 러너에서 더 두드려도 소용이
            // 없기 때문이다. 연결이 막힌 러너는 끝까지 막혀 있다(첫 사이클 실패율 11%, 그 뒤 0.11%).
            // 끊고 나면 새 러너에서 한 판 더 도는 쪽이 낫다.
            const maxConsecutiveFailures = 3;
            let consecutiveFailures = 0;
            let abortReason = null;
            let abortKind = null;
            let lastFailureKind = null;
            let lastFailureDetail = '';
            let lastCycleFailed = false;
            let sawActionable = false;

            // 사람이 손대야 한다고 한번 정해지면 저절로 낫는 실패가 그걸 되돌리지 못한다.
            // 되돌리면 실행이 초록으로 끝나고 재시도까지 도는데, 토큰이 죽은 날 그러면 아무도 모른다.
            const noteAbort = (kind, reason) => {
              if (abortKind === 'actionable') {
                abortReason = `${abortReason} / ${reason}`;
                return;
              }
              abortReason = reason;
              abortKind = kind;
            };

            // spawnSync로 돌린다. execFileSync는 성공했을 때 stderr를 돌려주지 않아 캐시 폴백이나
            // 노선 제외 경고가 사라지고, stdio를 통째로 inherit하면 실패했을 때 error.message가
            // `Command failed: node ...`로 끝나 원인 체인이 애노테이션과 요약에 남지 않는다.
            function runCollector() {
              const result = spawnSync('node', ['dist/tools/collector/src/collector.js', '--once'], {
                cwd: workspace,
                stdio: ['ignore', 'inherit', 'pipe'],
                env: process.env,
                encoding: 'utf8',
              });
              const output = (result.stderr ?? '').trim();
              // 성공이든 실패든 남긴다. 캐시로 되돌아간 노선이나 빠진 노선은 성공 사이클에서만 보인다.
              if (output) core.info(output);
              if (result.error) throw result.error;
              if (result.status !== 0) {
                const lastLine = output.split('\n').map((line) => line.trim()).filter(Boolean).pop();
                const failure = new Error(lastLine || `수집기가 종료 코드 ${result.status}로 끝났다`);
                failure.status = result.status;
                throw failure;
              }
            }

            do {
              cycleAttempted = true;
              try {
                runCollector();
                await uploadChangedFiles();
                consecutiveFailures = 0;
                cycleSucceeded = true;
                lastCycleFailed = false;
                if (oneShotMode) break;
              } catch (error) {
                // 사이클이 실패해도 그 전에 저장된 성공 노선의 스냅샷은 올린다.
                // 재시도까지 전부 실패해 실행이 끝나더라도 부분 데이터는 남는다.
                // 여기서 드러난 인증 실패는 삼키면 토큰 갱신 대응이 늦어지므로 즉시 끊는다.
                try {
                  await uploadChangedFiles();
                } catch (uploadError) {
                  if (uploadError.status === 401 || uploadError.status === 403) {
                    const reason = `데이터 저장소 인증 실패(${uploadError.status}). BUS_DATA_REPO_TOKEN을 갱신한다 (docs/operations/deployment.md): ${uploadError.message}`;
                    // 즉시 남긴다. 뒤 분기가 사유를 이어 붙이더라도 이 문구는 로그에 남아야 한다.
                    core.warning(reason);
                    noteAbort('actionable', reason);
                  } else {
                    core.warning(`실패 사이클의 성공분 업로드 실패: ${uploadError.message}`);
                  }
                }
                consecutiveFailures += 1;
                lastCycleFailed = true;
                // 수집기는 status에 종료 코드(0~255)를 담고 octokit HttpError는 HTTP 상태를
                // 담는다. 값 범위가 겹치지 않아 한 속성으로 둘 다 읽을 수 있다.
                lastFailureKind = error.status === transientExitCode ? 'transient' : 'actionable';
                if (lastFailureKind === 'actionable') sawActionable = true;
                const detail = error.message;
                lastFailureDetail = detail;
                if (error.status === 401 || error.status === 403) {
                  noteAbort('actionable', `데이터 저장소 인증 실패(${error.status}). BUS_DATA_REPO_TOKEN을 갱신한다 (docs/operations/deployment.md): ${error.message}`);
                } else if (consecutiveFailures >= maxConsecutiveFailures) {
                  noteAbort(lastFailureKind, `수집 사이클 연속 ${consecutiveFailures}회 실패로 중단한다. 호출만 나가고 데이터가 남지 않는다: ${detail}`);
                } else {
                  core.warning(`수집 사이클 실패(${lastFailureKind}), 다음 사이클에서 재시도: ${detail}`);
                }
              }
              if (abortReason) break;
              const now = Date.now();
              if (now < loopStartMs) {
                await sleep(loopStartMs - now);
                continue;
              }
              // 연속 실패 중에는 정규 간격을 기다리지 않는다. 낮 20분 간격이면 3회 실패까지
              // 40분이 흐른 뒤에야 새 러너로 넘어가는데, 그건 막힌 러너 앞에서 기다리는 시간일 뿐이다.
              const normalInterval = oneShotMode ? 45 : (eventIntervalSeconds ?? scheduledIntervalSeconds(now));
              const intervalSeconds = consecutiveFailures > 0 ? Math.min(normalInterval, 45) : normalInterval;
              if (now + intervalSeconds * 1000 >= loopEndMs) break;
              await sleep(intervalSeconds * 1000);
            } while (Date.now() < loopEndMs);

            if (abortReason) {
              finish(abortKind ?? 'actionable', abortReason);
            } else if (cycleAttempted && !cycleSucceeded) {
              // 한 건도 못 남겼는데 초록으로 끝나는 구멍을 막는다. 예전에는 이 검사가 단발
              // 모드에만 걸려 있어, 창 안 실행이 상류 실패로 전멸해도 성공으로 표시됐다.
              finish(lastFailureKind ?? 'actionable', `이번 실행은 스냅샷을 한 건도 남기지 못했다. 이 시간대 관측이 비었다: ${lastFailureDetail}`);
            } else if (lastCycleFailed) {
              // 창이 끝날 때 마지막 사이클이 실패했다. 앞선 성공이 이 상태를 덮으면 안 된다.
              finish(lastFailureKind ?? 'actionable', `창이 끝날 때 마지막 사이클이 실패했다: ${lastFailureDetail}`);
            } else {
              // 중간에 조치가 필요한 실패가 있었는데 뒤 사이클이 성공해 덮인 경우다. 실행을
              // 빨갛게 만들 만큼은 아니지만 흔적 없이 지나가면 안 된다.
              if (sawActionable) core.warning('중간에 조치가 필요한 실패가 있었으나 이후 사이클이 성공했다. 위 경고를 확인한다');
              finish('ok', '');
            }

      - name: Report collection outcome
        if: always() && steps.collect.outputs.outcome-kind != '' && steps.collect.outputs.outcome-kind != 'ok'
        uses: actions/github-script@v8
        env:
          OUTCOME_KIND: ${{ steps.collect.outputs.outcome-kind }}
          OUTCOME_REASON: ${{ steps.collect.outputs.outcome-reason }}
        with:
          script: |
            const kind = process.env.OUTCOME_KIND;
            const reason = process.env.OUTCOME_REASON;
            if (kind === 'actionable') {
              core.setFailed(reason);
              return;
            }
            // 사람이 할 수 있는 조치가 없는 실패는 실행을 빨갛게 만들지 않는다. 대신 요약에
            // 남겨, 며칠 이어지면 눈에 띄게 한다.
            core.warning(`저절로 낫는 실패라 실행은 실패로 남기지 않는다: ${reason}`);
            await core.summary
              .addHeading('수집 실패 (저절로 낫는 유형)', 3)
              .addRaw(reason)
              .write();
