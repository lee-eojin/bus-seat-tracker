name: Publish seat board

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Clone snapshot data
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BUS_DATA_REPO_TOKEN }}@github.com/lee-eojin/bus-seat-tracker-data.git" ../bus-data
          cd ../bus-data
          today_branch="collect/$(TZ=Asia/Seoul date +%F)"
          if git fetch --depth 1 origin "$today_branch"; then
            git checkout --quiet FETCH_HEAD
          fi

      # 라이브 예측 로그는 차량 가명 ID를 담으므로 발행 대상 밖, 비공개 저장소의 전용 브랜치에만 쌓는다.
      - name: Clone prediction log
        run: |
          url="https://x-access-token:${{ secrets.BUS_DATA_REPO_TOKEN }}@github.com/lee-eojin/bus-seat-tracker-data.git"
          if ! git clone --quiet --depth 1 --single-branch --branch predictions "$url" ../bus-predictions; then
            git clone --quiet --depth 1 "$url" ../bus-predictions
            git -C ../bus-predictions checkout --quiet --orphan predictions
            git -C ../bus-predictions rm -rf --quiet . || true
          fi

      - run: npm ci

      - run: npm run build

      - run: npm run build:data -- --data-dir=../bus-data/data --predictions=../bus-predictions/predictions/$(TZ=Asia/Seoul date +%F).jsonl

      - name: Append prediction log
        run: |
          cd ../bus-predictions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions
          if git diff --cached --quiet; then
            echo '기록할 예측이 없습니다'
            exit 0
          fi
          git commit --quiet -m "predictions: $(date -u +%FT%TZ)"
          git push --quiet origin predictions

      - name: Assemble site
        run: |
          mkdir -p site/prototype-bus site/dist
          cp prototype-bus/index.html prototype-bus/legal.html site/prototype-bus/
          cp -R prototype-bus/data site/prototype-bus/data
          cp -R dist/prototype-bus dist/shared site/dist/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=prototype-bus/" />' > site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

      # Vercel 프로젝트가 연결되면 같은 주기로 그쪽도 갱신한다. 훅이 없으면 건너뛴다 —
      # 설정 전에 이 스텝이 실패하면 예측 로그 적재까지 같이 멈춘다.
      # `secrets`는 `if:`에서 쓸 수 없으므로 env로 받아 셸에서 판정한다.
      - name: Trigger Vercel deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            # 건너뛰어도 잡은 초록으로 끝나므로, 갱신이 멈춘 걸 아무도 모른 채 며칠이 간다.
            # 2026-07-29에 배포본 데이터가 13.6시간 낡은 채로 있었다 (DEPLOY.md §4).
            echo "::warning::VERCEL_DEPLOY_HOOK_URL 미설정. 배포본 데이터가 갱신되지 않습니다 (DEPLOY.md §4)"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -o /dev/null
