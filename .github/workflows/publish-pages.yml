name: Publish seat board

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Clone snapshot data
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.BUS_DATA_REPO_TOKEN }}@github.com/lee-eojin/bus-seat-tracker-data.git" ../bus-data
          cd ../bus-data
          today_branch="collect/$(TZ=Asia/Seoul date +%F)"
          if git fetch --depth 1 origin "$today_branch"; then
            git checkout --quiet FETCH_HEAD
          fi

      # 라이브 예측 로그는 차량 가명 ID를 담으므로 발행 대상 밖, 비공개 저장소의 전용 브랜치에만 쌓는다.
      - name: Clone prediction log
        run: |
          url="https://x-access-token:${{ secrets.BUS_DATA_REPO_TOKEN }}@github.com/lee-eojin/bus-seat-tracker-data.git"
          if ! git clone --quiet --depth 1 --single-branch --branch predictions "$url" ../bus-predictions; then
            git clone --quiet --depth 1 "$url" ../bus-predictions
            git -C ../bus-predictions checkout --quiet --orphan predictions
            git -C ../bus-predictions rm -rf --quiet . || true
          fi

      - run: npm ci

      - run: npm run build

      - run: npm run build:data -- --data-dir=../bus-data/data --predictions=../bus-predictions/predictions/$(TZ=Asia/Seoul date +%F).jsonl

      - name: Append prediction log
        run: |
          cd ../bus-predictions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions
          if git diff --cached --quiet; then
            echo '기록할 예측이 없습니다'
            exit 0
          fi
          git commit --quiet -m "predictions: $(date -u +%FT%TZ)"
          git push --quiet origin predictions

      - name: Assemble site
        run: |
          mkdir -p site/prototype-bus site/dist
          cp prototype-bus/index.html site/prototype-bus/
          cp -R prototype-bus/data site/prototype-bus/data
          cp -R dist/prototype-bus dist/shared site/dist/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=prototype-bus/" />' > site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
