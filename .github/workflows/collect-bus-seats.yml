name: Collect bus seats

on:
  workflow_dispatch:
    inputs:
      event-duration-minutes:
        description: '이벤트 모드 수집 시간(분). 비우면 시간대 규칙을 따른다'
        required: false
      event-interval-seconds:
        description: '이벤트 모드 수집 간격(초)'
        required: false
        default: '300'
  schedule:
    - cron: '0 * * * *'      # 매시 시동. 피크 창은 이어받고, 운행 시간대엔 1회 스냅샷, 심야엔 즉시 종료
    - cron: '30 21 * * 0-4'  # KST 평일 06:30 아침 피크 시동
    - cron: '30 8 * * 1-5'   # KST 평일 17:30 저녁 피크 시동

permissions:
  contents: read

concurrency:
  group: bus-seat-collection
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect-cycle.yml
    with:
      event-duration-minutes: ${{ inputs.event-duration-minutes || '' }}
      event-interval-seconds: ${{ inputs.event-interval-seconds || '' }}
    secrets: inherit

  # GBIS 연결 실패는 러너마다 갈린다. 2026-08-07 11:21:11Z에 한 러너가 51대를 정상 수신하는
  # 동안 같은 순간 다른 러너는 두 노선 모두 연결에 실패했다. 첫 사이클에 연결된 러너의 이후
  # 실패율은 0.11%인데 첫 사이클 실패율은 11%라, 같은 러너에서 더 재시도해도 소용이 없다.
  # 새 러너를 받는 유일한 방법이 별도 잡이다.
  retry-on-fresh-runner:
    needs: collect
    # always()가 아니다. 실행을 취소했는데도 재시도 잡이 새로 떠서 최대 320분을 도는 일을 막는다.
    if: ${{ !cancelled() && needs.collect.outputs.retryable == 'true' }}
    uses: ./.github/workflows/collect-cycle.yml
    with:
      event-duration-minutes: ${{ inputs.event-duration-minutes || '' }}
      event-interval-seconds: ${{ inputs.event-interval-seconds || '' }}
    secrets: inherit
